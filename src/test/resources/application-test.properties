# Configuracao usada so nos testes (perfil "test", ativado com @ActiveProfiles("test")).
# Troca o Postgres por um H2 em memoria: o banco nasce quando o teste comeca e some quando termina.
spring.datasource.url=jdbc:h2:mem:gamelibrary-teste;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# cria as tabelas no inicio e apaga no fim
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# os testes nunca chamam a Steam de verdade
steam.api-key=
steam.steam-id=

# Chave JWT so para testes, nunca use em producao (esta chave e publica: esta no GitHub).
jwt.secret=chave-falsa-somente-para-testes-nunca-use-em-producao-0123456789

# Cookie de login com Secure, igual ao padrao de producao (o MockMvc nao exige HTTPS)
app.cookie.secure=true

# Vitrine: desliga a atualização em segundo plano (o AgendamentoConfig nem é carregado).
# Os testes nunca chamam a Steam de verdade.
vitrine.atualizacao-ativa=false
