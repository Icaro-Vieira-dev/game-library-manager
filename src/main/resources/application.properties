spring.application.name=game-liabrary-manager
spring.datasource.url=jdbc:postgresql://localhost:5432/gamelibrary
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Le o arquivo .env da raiz do projeto, se existir. Ele guarda os segredos e nao vai para o GitHub.
spring.config.import=optional:file:.env[.properties]

# Steam: os valores vem do .env (ou de variaveis de ambiente com o mesmo nome)
steam.api-key=${STEAM_API_KEY:}
steam.steam-id=${STEAM_ID:}
