spring.application.name=game-library-manager

# Le o arquivo .env da raiz do projeto, se existir. Ele guarda os segredos e nao vai para o GitHub.
spring.config.import=optional:file:.env[.properties]

# Banco: usuario e senha vem do .env (DB_USERNAME / DB_PASSWORD), nunca escritos aqui.
# O endereco tem um valor padrao (o banco local), que pode ser trocado com DB_URL no .env.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gamelibrary}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Paginacao (GET /jogos?page=0&size=20): no maximo 100 itens por pagina, mesmo que peçam mais
spring.data.web.pageable.max-page-size=100

# Steam: os valores vem do .env (ou de variaveis de ambiente com o mesmo nome)
steam.api-key=${STEAM_API_KEY:}
steam.steam-id=${STEAM_ID:}

# Vitrine (GET /vitrine): lancamentos e "em breve" da loja da Steam, atualizados em segundo plano.
# Os tempos usam o formato de duracao ISO-8601: PT = "periodo de tempo", depois o numero e a unidade.
#   PT6H = 6 horas, PT10S = 10 segundos, PT30M = 30 minutos.
# intervalo-atualizacao: quanto esperar entre o FIM de uma atualizacao e o inicio da proxima
vitrine.intervalo-atualizacao=PT6H
# atraso-inicial: quanto esperar, depois de a aplicacao subir, para a primeira atualizacao
vitrine.atraso-inicial=PT10S
# false desliga a atualizacao automatica (a vitrine fica vazia). Nos testes ela e desligada.
vitrine.atualizacao-ativa=true

# Seguranca: login com JWT (SegurancaConfig e UsuarioService)
# Chave que assina os tokens. Vem do .env (JWT_SECRET) e NUNCA e escrita aqui.
# Sem ela (ou com menos de 32 bytes) a aplicacao NAO SOBE, de proposito.
jwt.secret=${JWT_SECRET:}
# Validade do token, em minutos. Depois disso e preciso fazer login de novo.
jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:60}
# O unico site (front-end) que o navegador deixa chamar esta API. Nunca "*".
app.cors.origem-permitida=${CORS_ORIGEM:http://localhost:4200}
# Cookie de login com o atributo Secure (o navegador so manda por HTTPS). Os navegadores aceitam
# Secure tambem em http://localhost. Se algum navegador nao salvar o cookie no desenvolvimento,
# defina COOKIE_SECURE=false no .env (NUNCA false em producao).
app.cookie.secure=${COOKIE_SECURE:true}
# Limite de tentativas de login (contra forca bruta): depois de "maximo-falhas" erros dentro da
# "janela", aquele e-mail + IP fica bloqueado pelo tempo de "bloqueio" (formato PT15M = 15 minutos).
seguranca.login.maximo-falhas=5
seguranca.login.janela=PT15M
seguranca.login.bloqueio=PT15M
